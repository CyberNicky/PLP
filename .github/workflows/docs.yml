name: "Build, Generate docs, and Deploy"

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v5
    - name: "Use Common Java Build"
      uses: ./.github/actions/common-java-build
      with:
        java_version: '21'
    - name: Copy the classic UI to docs/
      run: |
        cp AppUI/target/classes/index.html docs/interpretador.html
        cp AppUI/target/javascript/classes.js* docs/
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: WebUI/package-lock.json
    - name: Test Funcional1 in the generated web runtime
      run: node WebAPI/test/funcional1-web.cjs
    - name: Build the web IDE (WebUI)
      working-directory: WebUI
      run: |
        # Publish under <Pages base path>/ide/; falls back to the default in vite.config.ts
        base_path="${{ steps.pages.outputs.base_path }}"
        if [ -n "$base_path" ]; then
          export WEBUI_BASE="${base_path%/}/ide/"
        fi
        # plp.js is the WebAPI module compiled to JS by TeaVM
        cp -r ../WebAPI/target/javascript/. public/
        npm ci --no-audit --no-fund
        npm run build
    - name: Copy the web IDE to docs/ide/
      run: |
        mkdir -p docs/ide
        cp -r WebUI/dist/. docs/ide/
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./docs/
        destination: ./docs/_site
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
